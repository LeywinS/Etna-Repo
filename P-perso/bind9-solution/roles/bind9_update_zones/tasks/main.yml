---
- name: Ensure one directory per view exists
  ansible.builtin.file:
    path: "{{ bind9_zone_root }}/{{ item }}"
    state: directory
    owner: "{{ bind9_user }}"
    group: "{{ bind9_group }}"
    mode: "0755"
  loop: "{{ bind9_views | map(attribute='name') | list }}"

# Produit cartésien zones x views, filtré : on ne déploie un
# fichier de zone que si la zone est déclarée dans cette view.
- name: Deploy zone files for each view
  ansible.builtin.template:
    src: zone.j2
    dest: "{{ bind9_zone_root }}/{{ view }}/{{ zone.name }}"
    owner: "{{ bind9_user }}"
    group: "{{ bind9_group }}"
    mode: "0644"
    validate: "named-checkzone {{ zone.name }} %s"
  loop: "{{ bind9_zones | product(bind9_views | map(attribute='name') | list) | list }}"
  loop_control:
    label: "{{ item.1 }}/{{ item.0.name }}"
  when: item.1 in item.0.views
  vars:
    zone: "{{ item.0 }}"
    view: "{{ item.1 }}"
  notify: Reload bind9

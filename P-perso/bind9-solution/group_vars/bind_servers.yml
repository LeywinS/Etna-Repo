---
# ============================================================
# Lab Proxmox 192.168.30.0/24
#   .80 = serveur DNS   .71 = client internal   .72 = client admin
#   tout le reste = external
# ============================================================

# L'ORDRE COMPTE : première view qui matche gagne -> "any" en dernier.
bind9_views:
  - name: admin
    match_clients:
      - "192.168.30.72/32"
  - name: internal
    match_clients:
      - "192.168.30.71/32"
  - name: external
    match_clients:
      - "any"

# Serial : incrémenter à CHAQUE modif (AAAAMMJJnn).
bind9_zones:
  - name: example.com
    ttl: 86400
    soa:
      primary: ns1.example.com.
      admin: hostmaster.example.com.
      serial: 2026081301
      refresh: 3600
      retry: 600
      expire: 604800
      minimum: 300
    views:
      admin:
        records:
          - ["@", "NS", "ns1.example.com."]
          - ["ns1", "A", "192.168.30.80"]
          - ["www", "A", "10.30.10.10"]
          - ["supervision", "A", "10.30.10.20"]
      internal:
        records:
          - ["@", "NS", "ns1.example.com."]
          - ["ns1", "A", "192.168.30.80"]
          - ["www", "A", "10.10.10.10"]
      external:
        records:
          - ["@", "NS", "ns1.example.com."]
          - ["ns1", "A", "192.168.30.80"]
          - ["www", "A", "203.0.113.10"]

  # Zone volontairement absente de la view external (test REFUSED)
  - name: lab.local
    ttl: 3600
    soa:
      primary: ns1.lab.local.
      admin: hostmaster.lab.local.
      serial: 2026081301
      refresh: 3600
      retry: 600
      expire: 604800
      minimum: 300
    views:
      admin:
        records:
          - ["@", "NS", "ns1.lab.local."]
          - ["ns1", "A", "192.168.30.80"]
          - ["gitlab", "A", "10.30.20.80"]
      internal:
        records:
          - ["@", "NS", "ns1.lab.local."]
          - ["ns1", "A", "192.168.30.80"]
          - ["gitlab", "A", "10.10.20.80"]
